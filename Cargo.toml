[package]
name = "grubbnet"
version = "0.3.0"
authors = ["Declan Hopkins <ratwizarddev@gmail.com>"]
edition = "2018"
rust-version = "1.85"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dooskington/grubbnet"
homepage = "https://crates.io/crates/grubbnet"
description = "Lightweight TCP client/server library for writing networked applications and games"

[lib]
name = "grubbnet"
crate-type = ["rlib"]

[dependencies]
mio = { version = "1.0", features = ["os-poll", "net"] }
byteorder = "1.5.0"
derive_more = { version = "2.0", features = ["display", "from"] }
openssl = { version = "0.10.81", optional = true }
bcrypt = { version = "0.19.3", optional = true }

[dev-dependencies]
wincode = { version = "0.6.0", features = ["derive"] }

[features]
crypto = ["openssl", "bcrypt"]